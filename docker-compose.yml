version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smartdrop_postgres
    restart: always
    environment:
      POSTGRES_USER: smartdrop_user
      POSTGRES_PASSWORD: smartdrop_secure_password_2026
      POSTGRES_DB: smartdrop_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdrop_user -d smartdrop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartdrop_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://smartdrop_user:smartdrop_secure_password_2026@postgres:5432/smartdrop_db
      - JWT_SECRET=super-secret-key-smartdrop-ai-2026-production
      - JWT_ALGORITHM=HS256
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","*"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # React Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartdrop_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
